const GBP = new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const total = ROWS.reduce((s, r) => s + r.amount, 0);
document.getElementById("lead").textContent =
  ROWS.length + " payments, " + GBP.format(total) + ". These are the supplier-name differences that were grouped as Other original names, because each name pair was smaller than the 18 pairs drawn on the diagram. Click a column heading to sort.";
let key = "amount";
let dir = -1;
function draw() {
  const sorted = ROWS.slice().sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
    return String(av).localeCompare(String(bv), "en", { numeric: true }) * dir;
  });
  document.getElementById("body").innerHTML = sorted.map((r) => `<tr>
    <td>${esc(r.year)}</td>
    <td class="num">${r.quarter}</td>
    <td>${esc(r.date)}</td>
    <td>${esc(r.txn)}</td>
    <td>${esc(r.original_supplier)}</td>
    <td>${esc(r.corrected_supplier)}</td>
    <td>${esc(r.original_purpose)}</td>
    <td>${esc(r.corrected_purpose)}</td>
    <td>${esc(r.original_area)}</td>
    <td>${esc(r.corrected_area)}</td>
    <td class="num">${GBP.format(r.amount)}</td>
    <td class="num">${GBP.format(r.delta)}</td>
  </tr>`).join("");
  document.querySelectorAll("th").forEach((th) => {
    th.classList.toggle("sorted", th.dataset.key === key);
    const mark = th.dataset.key === key ? (dir < 0 ? " ↓" : " ↑") : "";
    th.textContent = th.dataset.label + mark;
  });
}
document.querySelectorAll("th").forEach((th) => {
  th.dataset.label = th.textContent;
  th.addEventListener("click", () => {
    if (key === th.dataset.key) dir = -dir;
    else { key = th.dataset.key; dir = th.dataset.type === "number" ? -1 : 1; }
    draw();
  });
});
